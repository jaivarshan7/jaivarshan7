<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#38bdf8"/>
<stop offset="100%" stop-color="#60a5fa"/>
</linearGradient>

<style>
.title{
font-size:52px;
font-family:Arial;
font-weight:bold;
fill:url(#text);
}

.subtitle{
font-size:24px;
font-family:Arial;
fill:white;
}

.small{
font-size:18px;
font-family:Arial;
fill:#94a3b8;
}

.circle{
fill:#38bdf8;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:0.4;}
50%{opacity:1;}
100%{opacity:0.4;}
}

</style>

</defs>

<rect width="1200" height="300" fill="url(#bg)"/>

<circle cx="1050" cy="70" r="8" class="circle"/>
<circle cx="1100" cy="120" r="5" class="circle"/>
<circle cx="990" cy="180" r="7" class="circle"/>
<circle cx="1070" cy="220" r="6" class="circle"/>

<text x="60" y="110" class="title">
Jai Varshan
</text>

<text x="60" y="155" class="subtitle">
Full Stack Developer • IoT Enthusiast • Python Developer
</text>

<text x="60" y="205" class="small">
Building Smart Automation | Home Assistant | ESP32 | RFID Systems
</text>

</svg>
